# espanso's evdev detector calls unwrap() on the Wayland connection and aborts
# the whole worker when the compositor is not up yet:
#
#   [ERROR] thread 'detect thread' panicked at 'called `Result::unwrap()` on an
#           `Err` value: NoCompositor': espanso-detect/src/evdev/sync/wayland.rs:42
#   systemd: espanso.service: Main process exited, code=exited, status=101/n/a
#
# Restart=on-failure papers over it three seconds later, so this only ever cost
# a slow start and a noisy journal -- but the fix is cheap.
#
# A drop-in rather than an edited espanso.service: `espanso service register`
# rewrites that unit, and would drop anything added to it.

[Unit]
After=graphical-session.target
PartOf=graphical-session.target

[Service]
# Ordering alone is not enough, because espanso.service is pulled in by
# default.target rather than by graphical-session.target, so wait for the
# compositor's socket outright. Bounded at 30s so a session without Wayland
# still starts espanso instead of hanging the unit.
ExecStartPre=/usr/bin/bash -c 'for _ in $(seq 1 150); do for s in "$XDG_RUNTIME_DIR"/wayland-[0-9]; do [ -S "$s" ] && exit 0; done; sleep 0.2; done; exit 0'
